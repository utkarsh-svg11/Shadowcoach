<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowCoach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>ShadowCoach</div>
  <nav>
    <button data-view="scripts" class="active">Scripts</button>
    <button data-view="speakers">Speakers</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>

<main id="app"></main>

<div id="toast" class="toast" hidden></div>

<template id="tpl-scripts">
  <section class="wrap two">
    <div class="panel">
      <h2>New script</h2>
      <label>Title<input id="np-title" placeholder="Episode 12 — The fall of Rome"></label>
      <label>Script<textarea id="np-script" rows="14" placeholder="Paste your voiceover script. It's split into sentences automatically."></textarea></label>
      <button class="primary" id="np-create">Split into sentences</button>
    </div>
    <div class="panel">
      <h2>Your sessions</h2>
      <div id="project-list" class="list"></div>
    </div>
  </section>
</template>

<template id="tpl-session">
  <section class="session">
    <aside class="sents">
      <div class="sess-head">
        <button class="ghost" id="back">← All scripts</button>
        <h3 id="sess-title"></h3>
        <div class="progress"><div id="prog-bar"></div></div>
        <div class="muted small" id="prog-text"></div>
        <button class="linkish small" id="resplit" title="Join lines that were broken mid-sentence">Fix sentence splitting</button>
      </div>
      <ol id="sent-list"></ol>
      <div class="export">
        <button class="primary wide" id="export">Build final voiceover</button>
        <div id="export-out" class="small"></div>
      </div>
    </aside>

    <div class="stage">
      <div class="card line-card">
        <div class="line-meta"><span id="line-num"></span><span id="ref-src" class="chip"></span></div>
        <p id="line-text" class="line"></p>
        <div id="word-detail" class="word-detail" hidden></div>
      </div>

      <div class="card controls">
        <div class="row">
          <div class="group">
            <span class="cap">Reference</span>
            <button class="round ref" id="play-ref" title="Play reference (Space)">▶</button>
            <div class="speeds" id="speeds">
              <button data-r="0.6">0.6×</button><button data-r="0.75">0.75×</button><button data-r="0.9">0.9×</button><button data-r="1" class="on">1×</button>
            </div>
            <label class="toggle"><input type="checkbox" id="loop"> Loop</label>
          </div>
          <div class="group" id="regen-group">
            <select id="provider">
              <option value="azure">Azure voice</option>
              <option value="openai">OpenAI voice</option>
              <option value="elevenlabs">ElevenLabs voice</option>
              <option value="gemini">Gemini voice</option>
            </select>
            <button class="ghost" id="regen">Regenerate</button>
          </div>
        </div>
        <div class="row">
          <div class="group">
            <span class="cap">You</span>
            <button class="rec" id="rec" title="Record / stop (R)"><span></span></button>
            <span id="rec-time" class="mono">0:00</span>
            <button class="ghost" id="ab" title="Reference then you (A)">A/B compare</button>
          </div>
          <div class="group">
            <label class="toggle"><input type="checkbox" id="auto-ab" checked> Auto A/B</label>
            <label class="toggle"><input type="checkbox" id="auto-an" checked> Accent check</label>
          </div>
        </div>
        <div class="keys muted small">Space reference · R record · A compare · K keep · ← → move</div>
      </div>

      <div class="card coach" id="coach" hidden></div>
      <div class="card results" id="results" hidden>
        <details id="details">
          <summary>Detailed measurements <span class="muted small">— sound scores, melody graph, rhythm</span></summary>
          <div class="scores" id="scores"></div>
          <div id="warnings"></div>
          <h4>Measured issues</h4>
          <ul class="notes" id="notes"></ul>
          <h4>Melody <span class="legend"><i class="lg-ref"></i>Reference <i class="lg-you"></i>You</span></h4>
          <canvas id="chart" height="220"></canvas>
          <div class="stats small muted" id="stats"></div>
        </details>
      </div>
      <div class="card analysing" id="analysing" hidden><div class="spinner"></div>The coach is listening to your take…</div>

      <div class="card">
        <h4>Takes</h4>
        <div id="takes" class="takes"></div>
      </div>
      <div class="nav-row">
        <button class="ghost" id="prev">← Previous</button>
        <button class="ghost" id="next">Next →</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-speakers">
  <section class="wrap two">
    <div class="panel">
      <h2>Add a narrator to learn from</h2>
      <p class="muted">Paste a YouTube video of an American narrator you want to sound like. The app listens to their voice, measures their pace, melody and pauses, and cuts their sentences into clips you can shadow.</p>
      <label>Name<input id="sp-name" placeholder="e.g. Kurzgesagt narrator"></label>
      <label>YouTube link<input id="sp-url" placeholder="https://www.youtube.com/watch?v=…"></label>
      <button class="primary" id="sp-add">Analyse video</button>
      <div class="or">or upload the audio yourself</div>
      <label>Audio / video file<input type="file" id="sp-file" accept="audio/*,video/*"></label>
      <button class="ghost" id="sp-upload">Upload &amp; analyse</button>
      <p class="muted small">YouTube sometimes blocks downloads from cloud servers. If that happens, download the audio on your computer and upload it here.</p>
    </div>
    <div class="panel">
      <h2>Speakers</h2>
      <div id="speaker-list" class="list"></div>
    </div>
  </section>
</template>

<template id="tpl-settings">
  <section class="wrap">
    <div class="panel">
      <h2>Reference voice</h2>
      <div class="radio-row" id="prov-radio">
        <label><input type="radio" name="tts_provider" value="azure"> Azure</label>
        <label><input type="radio" name="tts_provider" value="openai"> OpenAI</label>
        <label><input type="radio" name="tts_provider" value="elevenlabs"> ElevenLabs</label>
        <label><input type="radio" name="tts_provider" value="gemini"> Gemini <span class="muted small">(free tier)</span></label>
      </div>
      <div class="grid3 voices-grid">
        <fieldset>
          <legend>Azure Speech <span class="muted small">(also runs the accent check)</span></legend>
          <label>Key<input type="password" data-k="azure_key" autocomplete="off"></label>
          <label>Region<input data-k="azure_region" placeholder="eastus"></label>
          <label>Voice<input data-k="azure_voice" list="azure-voices"></label>
          <label>Speed<input data-k="azure_rate" placeholder="0% or -10%"></label>
        </fieldset>
        <fieldset>
          <legend>OpenAI</legend>
          <label>API key<input type="password" data-k="openai_key" autocomplete="off"></label>
          <label>Model<input data-k="openai_model" list="openai-models"></label>
          <label>Voice<input data-k="openai_voice" list="openai-voices"></label>
          <label>Style instructions<textarea data-k="openai_instructions" rows="3"></textarea></label>
        </fieldset>
        <fieldset>
          <legend>ElevenLabs</legend>
          <label>API key<input type="password" data-k="elevenlabs_key" autocomplete="off"></label>
          <label>Voice ID<input data-k="elevenlabs_voice_id"></label>
          <label>Model<input data-k="elevenlabs_model"></label>
        </fieldset>
        <fieldset>
          <legend>Gemini <span class="muted small">(Google AI Studio key)</span></legend>
          <label>API key<input type="password" data-k="gemini_key" autocomplete="off"></label>
          <label>Model<input data-k="gemini_model" list="gemini-models"></label>
          <label>Voice<input data-k="gemini_voice" list="gemini-voices"></label>
          <button class="ghost small" id="gemini-find" type="button">Find American-accent voices</button>
          <div id="gemini-found" class="small muted"></div>
          <label style="margin-top:12px">Delivery style<textarea data-k="gemini_style" rows="2"></textarea></label>
        </fieldset>
      </div>
      <h2>Coaching</h2>
      <div class="grid3">
        <label>Match my style to<select data-k="target_speaker" id="target-select"></select></label>
        <label>Gap between sentences in export (sec)<input type="number" step="0.05" data-k="export_gap"></label>
        <label>Max YouTube minutes to analyse<input type="number" data-k="youtube_max_minutes"></label>
      </div>
      <button class="primary" id="save-settings">Save settings</button>
      <p class="muted small">Keys are stored on your server only and are never sent back to the browser. Leave a key box empty to keep the saved one.</p>
    </div>
  </section>
  <datalist id="azure-voices"><option>en-US-AndrewNeural<option>en-US-BrianNeural<option>en-US-GuyNeural<option>en-US-DavisNeural<option>en-US-ChristopherNeural<option>en-US-AvaNeural<option>en-US-EmmaNeural<option>en-US-JennyNeural</datalist>
  <datalist id="gemini-coach-models"><option>gemini-3.8-flash<option>gemini-3.8-flash-lite</datalist>
  <datalist id="gemini-models"><option>gemini-3.8-flash-tts<option>gemini-3.8-flash-lite-tts</datalist>
  <datalist id="gemini-voices"><option>Charon<option>Orus<option>Iapetus<option>Algieba<option>Alnilam<option>Schedar<option>Kore<option>Aoede<option>Sulafat<option>Achird</datalist>
  <datalist id="openai-models"><option>gpt-4o-mini-tts<option>tts-1-hd<option>tts-1</datalist>
  <datalist id="openai-voices"><option>onyx<option>ash<option>echo<option>alloy<option>ballad<option>sage<option>verse<option>nova<option>shimmer<option>coral</datalist>
</template>

<script src="/static/app.js"></script>
</body>
</html>
